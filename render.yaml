# Render Blueprint — S Combinator Central Agent Platform
# Docs: https://render.com/docs/blueprint-spec
#
# After you commit + push this file to GitHub `main`, reload / Manual Sync the Blueprint.
# You will be prompted to fill secrets marked sync: false.
#
# Google Cloud Console → OAuth client → Authorized redirect URIs must include:
#   https://scombinator-backend.onrender.com/api/companies/oauth/callback
#
# n8n is optional on Render. Local Docker n8n can still call the Render backend later.

databases:
  - name: scombinator-db
    plan: free
    databaseName: s_combinator
    user: scombinator

services:
  # ---------- Backend (FastAPI) ----------
  - type: web
    name: scombinator-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_render.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: APP_NAME
        value: S Combinator Central Agent Platform
      - key: APP_VERSION
        value: "1.0.0"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: scombinator-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ROLE
        value: ADMIN
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: N8N_SERVICE_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Required for "Connect Gmail & Drive" without public n8n
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BACKEND_PUBLIC_URL
        value: https://scombinator-backend.onrender.com

  # ---------- Frontend (React / Vite static site) ----------
  - type: web
    name: scombinator-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx vite build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: scombinator-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Client ID is public (browser-side). Must be set at build time.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
